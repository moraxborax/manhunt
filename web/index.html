  <script>
    // Screen Wake Lock helpers for Flutter dart:js_interop
    let _manhuntWakeLockSentinel = null;

    async function manhuntWakeLock() {
      try {
        if (navigator.wakeLock) {
          _manhuntWakeLockSentinel = await navigator.wakeLock.request('screen');
        }
      } catch (e) {
        console.warn('wakeLock failed', e);
      }
      return null;
    }

    async function manhuntReleaseWakeLock() {
      try {
        if (_manhuntWakeLockSentinel) {
          await _manhuntWakeLockSentinel.release();
          _manhuntWakeLockSentinel = null;
        }
      } catch (e) {}
      return null;
    }

    // Compass / device orientation for radar (Levels 1–2)
    let _manhuntHeadingHandler = null;

    function manhuntOnHeading(fn) {
      _manhuntHeadingHandler = fn;
    }

    async function manhuntRequestCompass() {
      const attach = () => {
        window.addEventListener('deviceorientation', (event) => {
          let heading = null;
          if (typeof event.webkitCompassHeading === 'number') {
            heading = event.webkitCompassHeading;
          } else if (typeof event.alpha === 'number') {
            heading = (360 - event.alpha) % 360;
          }
          if (heading != null && _manhuntHeadingHandler) {
            _manhuntHeadingHandler(heading);
          }
        }, true);
      };

      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            attach();
            return true;
          }
          return false;
        }
        attach();
        return true;
      } catch (e) {
        console.warn('compass permission failed', e);
        attach();
        return true;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        manhuntWakeLock();
      }
    });

    // Native share sheet (iOS Safari / Android Chrome) with clipboard fallback.
    // Returns: 'shared' | 'copied' | 'failed'
    async function manhuntShareUrl(title, text, url) {
      try {
        if (navigator.share) {
          await navigator.share({ title: title, text: text, url: url });
          return 'shared';
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return 'failed';
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
          return 'copied';
        }
      } catch (e) {}
      return 'failed';
    }
  </script>
